apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, labels: {app: backend, version: v1}}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend, version: v1}}
    spec:
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        ports: [{containerPort: 8080}]
        env: [{name: APP_ENV, value: {{ .Values.env }}}, {name: APP_VERSION, value: "1"}]
        readinessProbe: {httpGet: {path: /health, port: 8080}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, labels: {app: frontend, version: v1}}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend, version: v1}}
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        ports: [{containerPort: 8080}]
        env: [{name: APP_ENV, value: {{ .Values.env }}}, {name: APP_VERSION, value: "1"}, {name: BACKEND_URL, value: "http://backend:8080"}]
        readinessProbe: {httpGet: {path: /health, port: 8080}}
