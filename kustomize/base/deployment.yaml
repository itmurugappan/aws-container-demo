apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, labels: {app: backend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend, version: v1}}
    spec:
      containers:
      - name: backend
        image: 150043945349.dkr.ecr.ap-south-1.amazonaws.com/demo-backend:latest
        ports: [{containerPort: 8080}]
        env: [{name: APP_ENV, value: DEV}, {name: APP_VERSION, value: "1"}]
        readinessProbe: {httpGet: {path: /health, port: 8080}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, labels: {app: frontend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend, version: v1}}
    spec:
      containers:
      - name: frontend
        image: 150043945349.dkr.ecr.ap-south-1.amazonaws.com/demo-frontend:latest
        ports: [{containerPort: 8080}]
        env: [{name: APP_ENV, value: DEV}, {name: APP_VERSION, value: "1"}, {name: BACKEND_URL, value: "http://backend:8080"}]
        readinessProbe: {httpGet: {path: /health, port: 8080}}
