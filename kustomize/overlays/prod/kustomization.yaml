apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources: [../../base]
namePrefix: prod-
replicas:
- {name: frontend, count: 3}
- {name: backend, count: 3}
patches:
- target: {kind: Deployment, name: frontend}
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: PROD
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: http://prod-backend:8080
- target: {kind: Deployment, name: backend}
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: PROD
